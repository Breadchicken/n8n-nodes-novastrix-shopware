version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Majors of the toolchain are updated by hand: the node supports n8n 1.x to 3.x, so the
      # n8n-workflow types must not drift to APIs older n8n versions lack; @n8n/node-cli and eslint must match n8n's verification lint, and
      # TypeScript 7 breaks the lint run (typescript-eslint, "reading 'Intrinsic'").
      - dependency-name: n8n-workflow
        update-types: ['version-update:semver-major']
      - dependency-name: '@n8n/node-cli'
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # isolated-vm (via n8n-workflow) needs the Node major that n8n itself uses.
      - dependency-name: node
        update-types: ['version-update:semver-major']
